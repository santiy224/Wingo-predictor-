<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wingo Prediction</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; padding: 20px; text-align: center; }
    .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
    h1 { color: #333; }
    textarea { width: 100%; height: 100px; margin-top: 10px; }
    button { margin-top: 15px; padding: 10px 20px; background: green; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: darkgreen; }
    .result { margin-top: 20px; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>66Lottery Wingo Predictor</h1>
    <p>Enter last 10 results (0–9, comma separated):</p>
    <textarea id="input" placeholder="e.g. 3,7,4,1,9,2,8,5,0,6"></textarea>
    <button onclick="predict()">Predict</button>
    <div class="result" id="output"></div>
  </div>

  <script>
    function predict() {
      const input = document.getElementById("input").value;
      const numbers = input.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));
      if (numbers.length < 5) {
        document.getElementById("output").innerText = "Please enter at least 5 numbers.";
        return;
      }
      const freq = Array(10).fill(0);
      numbers.forEach(n => { if (n >= 0 && n <= 9) freq[n]++; });
      const predicted = freq.indexOf(Math.max(...freq));
      const size = predicted >= 5 ? "Big" : "Small";
      document.getElementById("output").innerText = `Predicted Number: ${predicted} → Likely: ${size}`;
    }
  </script>
</body>
</html>
